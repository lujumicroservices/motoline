<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RiderLab — Restablecer contraseña</title>
  <style>
    :root {
      --bg: #0e1013;
      --card: #171a1f;
      --text: #f1f5f8;
      --muted: #9ba4ae;
      --line: #00d4aa;
      --signal: #ff5a3c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, Segoe UI, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }
    main {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border-radius: 16px;
      padding: 28px 22px 24px;
    }
    h1 {
      margin: 0 0 6px;
      font-size: 1.55rem;
      letter-spacing: 0.02em;
    }
    .sub { color: var(--muted); font-size: 0.95rem; line-height: 1.45; margin: 0 0 22px; }
    label {
      display: block;
      font-size: 0.85rem;
      color: var(--muted);
      margin: 0 0 6px;
    }
    input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid #2a3038;
      background: #0e1013;
      color: var(--text);
      font-size: 1rem;
      margin-bottom: 14px;
    }
    input:focus {
      outline: 2px solid color-mix(in srgb, var(--line) 55%, transparent);
      border-color: var(--line);
    }
    button {
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 13px 16px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      background: var(--line);
      color: #0e1013;
    }
    button:disabled {
      opacity: 0.55;
      cursor: default;
    }
    .msg {
      margin-top: 14px;
      font-size: 0.92rem;
      line-height: 1.4;
      color: var(--muted);
    }
    .msg.err { color: var(--signal); }
    .msg.ok { color: var(--line); }
    .brand {
      font-size: 0.75rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--line);
      margin-bottom: 10px;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main>
    <div class="brand">RiderLab</div>
    <h1 id="title">Nueva contraseña</h1>
    <p class="sub" id="subtitle">Abre este enlace desde el correo de restablecimiento. Funciona en computadora o teléfono.</p>

    <div id="waiting">
      <p class="msg">Validando el enlace…</p>
    </div>

    <form id="form" hidden>
      <label for="password">Nueva contraseña</label>
      <input id="password" type="password" autocomplete="new-password" minlength="6" required />
      <label for="confirm">Confirmar</label>
      <input id="confirm" type="password" autocomplete="new-password" minlength="6" required />
      <button id="submit" type="submit">Guardar contraseña</button>
    </form>

    <p class="msg" id="status" hidden></p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.min.js"></script>
  <script src="./config.js"></script>
  <script>
    (function () {
      const cfg = window.RL_AUTH;
      const waiting = document.getElementById('waiting');
      const form = document.getElementById('form');
      const status = document.getElementById('status');
      const submit = document.getElementById('submit');

      function showStatus(text, kind) {
        status.hidden = false;
        status.textContent = text;
        status.className = 'msg' + (kind ? ' ' + kind : '');
      }

      if (!cfg || !cfg.supabaseUrl || !cfg.supabaseAnonKey) {
        waiting.hidden = true;
        showStatus('Falta la configuración de RiderLab Auth en esta página.', 'err');
        return;
      }

      const client = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey, {
        auth: {
          detectSessionInUrl: true,
          flowType: 'implicit',
          persistSession: true,
          autoRefreshToken: true,
        },
      });

      let recoveryReady = false;

      function unlockForm() {
        recoveryReady = true;
        waiting.hidden = true;
        form.hidden = false;
        showStatus('Elige una contraseña de al menos 6 caracteres.', null);
      }

      function failLink(detail) {
        waiting.hidden = true;
        form.hidden = true;
        showStatus(
          detail ||
            'Este enlace no es válido o ya expiró. Pide un correo nuevo desde RiderLab (Olvidé mi contraseña).',
          'err'
        );
      }

      client.auth.onAuthStateChange(function (event, session) {
        if (event === 'PASSWORD_RECOVERY' && session) {
          unlockForm();
        }
      });

      client.auth.getSession().then(function (res) {
        const session = res.data && res.data.session;
        const hash = window.location.hash || '';
        const isRecovery =
          hash.indexOf('type=recovery') !== -1 ||
          (window.location.search || '').indexOf('type=recovery') !== -1;
        if (session && isRecovery) {
          unlockForm();
          return;
        }
        if (session && !isRecovery) {
          // Already signed in from a prior visit — still allow password update
          // if they arrived with tokens that established a session.
          unlockForm();
          return;
        }
        if (!session && !isRecovery) {
          failLink();
        }
      }).catch(function () {
        failLink();
      });

      // Give the hash parser a moment; then fail if still waiting.
      setTimeout(function () {
        if (recoveryReady) return;
        client.auth.getSession().then(function (res) {
          if (recoveryReady) return;
          if (res.data && res.data.session) unlockForm();
          else failLink();
        });
      }, 2500);

      form.addEventListener('submit', async function (e) {
        e.preventDefault();
        const password = document.getElementById('password').value;
        const confirm = document.getElementById('confirm').value;
        if (password.length < 6) {
          showStatus('La contraseña debe tener al menos 6 caracteres.', 'err');
          return;
        }
        if (password !== confirm) {
          showStatus('Las contraseñas no coinciden.', 'err');
          return;
        }
        submit.disabled = true;
        showStatus('Guardando…', null);
        try {
          const { error } = await client.auth.updateUser({ password: password });
          if (error) throw error;
          form.hidden = true;
          showStatus(
            'Listo. Ya puedes cerrar esta pestaña e iniciar sesión en RiderLab con la nueva contraseña.',
            'ok'
          );
          await client.auth.signOut();
        } catch (err) {
          showStatus((err && err.message) || 'No se pudo guardar la contraseña.', 'err');
          submit.disabled = false;
        }
      });
    })();
  </script>
</body>
</html>
