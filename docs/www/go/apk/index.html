<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RiderLab — descargar APK</title>
  <link rel="canonical" href="https://riderlab.rawthrottle.com.mx/go/apk" />
  <style>
    :root { --bg:#0e1013; --mist:#f1f5f8; --steel:#9ba4ae; --line:#00d4aa; --card:#151920; --hair:#2a313a; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--mist); font-family:system-ui,sans-serif; text-align:center; padding:32px; }
    a { color:var(--line); }
    p { color:var(--steel); max-width:36rem; line-height:1.5; margin: 0 auto 12px; }
    h1 { font-size: 28px; margin: 8px 0 16px; }
    .card { background:var(--card); border:1px solid var(--hair); border-radius:16px; padding:28px 24px; }
    .kicker { letter-spacing:.18em; text-transform:uppercase; font-size:12px; font-weight:700; color:var(--line); }
    .btn {
      display:inline-flex; margin-top:8px; background:var(--line); color:#04221b;
      font-weight:800; border-radius:999px; padding:14px 22px; text-decoration:none;
    }
  </style>
</head>
<body>
  <main class="card">
    <p class="kicker">RiderLab · Android</p>
    <h1>Descargar APK</h1>
    <p>Instalación directa. Play Store sigue en revisión. En el teléfono: permite instalar de esta fuente si Android lo pide, luego abre el archivo.</p>
    <p><a class="btn" id="dl" href="/app/riderlab.apk" download="RiderLab.apk">Descargar RiderLab.apk</a></p>
    <p><a href="/">Volver al inicio</a></p>
  </main>
  <script>
    const a = document.getElementById("dl");
    if (a) setTimeout(() => { a.click(); }, 400);
  </script>
</body>
</html>
