<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RiderLab — App Store</title>
  <style>
    :root { --bg:#0e1013; --mist:#f1f5f8; --steel:#9ba4ae; --line:#00d4aa; --card:#151920; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--mist); font-family:system-ui,sans-serif; text-align:center; padding:32px; }
    a { color:var(--line); }
    p { color:var(--steel); max-width:36rem; line-height:1.5; }
    .card { background:var(--card); border:1px solid #2a313a; border-radius:16px; padding:28px 24px; }
  </style>
</head>
<body>
  <main class="card">
    <p style="letter-spacing:.18em; text-transform:uppercase; font-size:12px; font-weight:700; color:var(--line); margin-top:0">RiderLab · iOS</p>
    <h1>Pronto en App Store</h1>
    <p>La versión para iPhone está en camino. En Android puedes instalar el APK mientras Play termina la revisión.</p>
    <p><a href="/go/apk">Descargar APK Android</a> · <a href="/">Volver al inicio</a></p>
  </main>
</body>
</html>
