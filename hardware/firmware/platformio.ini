; RiderLab logger — M5Stack Basic + GNSS M135
; python -m platformio run
; python -m platformio run -t upload

[env:m5stack-basic]
platform = espressif32@6.7.0
board = m5stack-core-esp32
framework = arduino
monitor_speed = 115200
; Basic v2.7 has 16 MB flash (esptool flash_id). default_16MB.csv keeps NVS at
; 0x9000/0x5000 (Wi-Fi, pairing, role, REF survive) and gives 6.25 MB per app.
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
upload_speed = 1500000
; RTS after flash can leave Basic in DOWNLOAD_BOOT (black screen).
upload_flags =
  --after
  no_reset
build_flags =
  -DCORE_DEBUG_LEVEL=3
  -DARDUINO_USB_CDC_ON_BOOT=0
  -std=gnu++17
build_unflags =
  -std=gnu++11

lib_deps =
  m5stack/M5Unified@^0.2.2
  m5stack/M5GFX@^0.2.2
  mikalhart/TinyGPSPlus@^1.0.3
  adafruit/Adafruit BMP280 Library@^2.6.8
  adafruit/Adafruit BusIO@^1.16.1
