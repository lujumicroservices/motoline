name: apk-release

# Sideload APK for in-app updates. The app reads GitHub Releases /latest.
# Push a tag vX.Y.Z, or run this workflow on the branch that should ship.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sideload-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Write signing + env files
        env:
          PLAY_KEYSTORE_BASE64: ${{ secrets.PLAY_KEYSTORE_BASE64 }}
          PLAY_KEYSTORE_PASSWORD: ${{ secrets.PLAY_KEYSTORE_PASSWORD }}
          PLAY_KEY_PASSWORD: ${{ secrets.PLAY_KEY_PASSWORD }}
          PLAY_KEY_ALIAS: ${{ secrets.PLAY_KEY_ALIAS }}
          MOBILE_ENV: ${{ secrets.MOBILE_ENV }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          test -n "$PLAY_KEYSTORE_BASE64"
          test -n "$PLAY_KEYSTORE_PASSWORD"
          test -n "$PLAY_KEY_PASSWORD"
          test -n "${PLAY_KEY_ALIAS:-upload}"
          test -n "$MOBILE_ENV"
          test -n "$GOOGLE_SERVICES_JSON"
          echo "$PLAY_KEYSTORE_BASE64" | base64 -d > android/upload-keystore.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n' \
            "$PLAY_KEYSTORE_PASSWORD" \
            "$PLAY_KEY_PASSWORD" \
            "${PLAY_KEY_ALIAS:-upload}" \
            > android/key.properties
          printf '%s\n' "$MOBILE_ENV" > .env
          printf '%s\n' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

      - name: ride_core deps
        working-directory: packages/ride_core
        run: dart pub get

      - name: Build sideload APK
        run: |
          flutter pub get
          flutter gen-l10n
          flutter build apk --flavor sideload --release --dart-define=DISTRIBUTION=sideload

      - name: Publish GitHub Release
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(awk '/^version:/ {print $2; exit}' apps/mobile/pubspec.yaml)
          name="${version%%+*}"
          apk="apps/mobile/build/app/outputs/flutter-apk/app-sideload-release.apk"
          test -f "$apk"
          cp "$apk" "RiderLab-v${name}.apk"
          notes=$(mktemp)
          {
            echo "Sideload APK (not uploaded to Play closed test)."
            echo
            cat apps/mobile/play/whatsnew/whatsnew-es-419
            echo
            echo "Instalar: abre el APK en el teléfono. Si Android bloquea, permite instalar apps desconocidas para Chrome/Archivos."
            echo
            echo "Si ya tienes RiderLab del closed test de Play, desinstálalo primero (firma distinta)."
          } > "$notes"
          gh release create "v${name}" "RiderLab-v${name}.apk" \
            --title "RiderLab ${name}" \
            --notes-file "$notes"
