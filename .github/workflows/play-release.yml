name: play-release

# Builds the Play flavor AAB and uploads it to Internal testing.
# One-time setup: GitHub repo secrets listed in docs/PLAY_STORE.md §8.
on:
  workflow_dispatch:
    inputs:
      track:
        description: Play track
        type: choice
        options:
          - internal
          - alpha
          - beta
        default: internal

jobs:
  bundle-and-upload:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Write signing + env files
        env:
          PLAY_KEYSTORE_BASE64: ${{ secrets.PLAY_KEYSTORE_BASE64 }}
          PLAY_KEYSTORE_PASSWORD: ${{ secrets.PLAY_KEYSTORE_PASSWORD }}
          PLAY_KEY_PASSWORD: ${{ secrets.PLAY_KEY_PASSWORD }}
          PLAY_KEY_ALIAS: ${{ secrets.PLAY_KEY_ALIAS }}
          MOBILE_ENV: ${{ secrets.MOBILE_ENV }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          test -n "$PLAY_KEYSTORE_BASE64"
          test -n "$PLAY_KEYSTORE_PASSWORD"
          test -n "$PLAY_KEY_PASSWORD"
          test -n "${PLAY_KEY_ALIAS:-upload}"
          test -n "$MOBILE_ENV"
          test -n "$GOOGLE_SERVICES_JSON"
          echo "$PLAY_KEYSTORE_BASE64" | base64 -d > android/upload-keystore.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n' \
            "$PLAY_KEYSTORE_PASSWORD" \
            "$PLAY_KEY_PASSWORD" \
            "${PLAY_KEY_ALIAS:-upload}" \
            > android/key.properties
          printf '%s\n' "$MOBILE_ENV" > .env
          printf '%s\n' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

      - name: ride_core deps
        working-directory: packages/ride_core
        run: dart pub get

      - name: Build Play App Bundle
        run: |
          flutter pub get
          flutter gen-l10n
          flutter build appbundle --flavor play --release --dart-define=DISTRIBUTION=play

      - name: Upload to Play Console
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.rawthrottle.riderlab
          releaseFiles: apps/mobile/build/app/outputs/bundle/playRelease/app-play-release.aab
          track: ${{ inputs.track }}
          status: completed
          releaseName: RiderLab 1.37.7
          whatsNewDirectory: apps/mobile/play/whatsnew
